// The on-device analysis engine: a Kotlin port of chordify_core. No UI, no network.
plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace 'com.arbaba.chordifymobile.engine'
    compileSdk 35

    defaultConfig {
        minSdk 33
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        // Golden-file helpers serve both test kinds; the device tests read the same golden files.
        test {
            java.srcDirs += 'src/sharedTest/kotlin'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation libs.kotlinx.serialization.json
    testImplementation libs.junit
}
