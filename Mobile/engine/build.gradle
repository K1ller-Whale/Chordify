// The on-device analysis engine: a Kotlin port of chordify_core plus a native library
// (NNLS Chroma, libsoxr; src/main/cpp). No UI, no network.
plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.serialization)
}

android {
    namespace 'com.arbaba.chordifymobile.engine'
    compileSdk 35
    ndkVersion '27.0.12077973'

    defaultConfig {
        minSdk 33
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        // Golden-file helpers serve both test kinds; the device tests read the same golden files.
        test {
            java.srcDirs += 'src/sharedTest/kotlin'
        }
        androidTest {
            java.srcDirs += 'src/sharedTest/kotlin'
            resources.srcDirs += 'src/test/resources'
        }
    }
    testOptions {
        managedDevices {
            localDevices {
                create('api34') {
                    device = 'Pixel 6'
                    apiLevel = 34
                    systemImageSource = 'google'
                }
            }
        }
    }
}

// The models live once in git, in the repository's models/ folder; the engine's assets get a copy
// of the two it runs, made at build time.
def modelAssets = layout.buildDirectory.dir('generated/modelAssets').get().asFile
def copyModels = tasks.register('copyModels', Copy) {
    from(rootProject.file('../models')) {
        include 'chordnet-chroma/3.0.0/**', 'progression-ngram/1.0.0/**'
    }
    into new File(modelAssets, 'models')
}
android.sourceSets.main.assets.srcDir(modelAssets)
tasks.named('preBuild') { dependsOn copyModels }

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation libs.kotlinx.serialization.json
    implementation libs.onnxruntime.android
    testImplementation libs.junit
    androidTestImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.androidx.test.runner
}
