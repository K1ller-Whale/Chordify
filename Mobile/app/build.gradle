// The Chordify app: Compose screens over the on-device engine (:engine). Everything runs on the
// phone; the app has no network access.
plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.ksp)
}

android {
    namespace 'com.arbaba.chordifymobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.arbaba.chordifymobile'
        minSdk 30
        targetSdk 35
        versionCode 2
        versionName '2.0.0-dev'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // Only the ABIs the engine's native library is built for (engine/build.gradle): ONNX Runtime
        // also ships 32-bit libraries, which would install the app on phones it cannot run on.
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            // Not minified yet: ONNX Runtime and the engine's JNI classes would need keep rules that no
            // test covers. An App Bundle (bundleRelease) gives each phone only its own ABI.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
    }
    sourceSets {
        // The device tests analyse the engine's golden audio inputs.
        androidTest {
            resources.srcDirs += '../engine/src/test/resources'
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
        managedDevices {
            localDevices {
                create('api34') {
                    device = 'Pixel 6'
                    apiLevel = 34
                    systemImageSource = 'google'
                }
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

ksp {
    arg('room.schemaLocation', "$projectDir/schemas")
}

dependencies {
    implementation project(':engine')
    implementation libs.kotlinx.serialization.json
    implementation libs.androidx.core.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.material3
    implementation libs.compose.material.icons.core
    implementation libs.lifecycle.viewmodel.compose
    implementation libs.lifecycle.runtime.compose
    implementation libs.navigation.compose
    implementation libs.room.runtime
    implementation libs.room.ktx
    ksp libs.room.compiler
    implementation libs.work.runtime.ktx
    implementation libs.datastore.preferences
    implementation libs.media3.exoplayer
    debugImplementation libs.compose.ui.tooling
    debugImplementation libs.compose.ui.test.manifest

    testImplementation libs.junit
    testImplementation libs.kotlinx.serialization.json
    testImplementation libs.robolectric
    testImplementation libs.ext.junit
    testImplementation platform(libs.compose.bom)
    testImplementation libs.compose.ui.test.junit4
    androidTestImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation platform(libs.compose.bom)
    androidTestImplementation libs.compose.ui.test.junit4
    androidTestImplementation libs.kotlinx.serialization.json
}
