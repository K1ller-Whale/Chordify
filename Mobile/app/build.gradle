plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.arbaba.chordifymobile'
    compileSdk 35

    defaultConfig {
        applicationId "com.arbaba.chordifymobile"
        minSdk 33
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    
    // Retrofit (Networking) & Gson (JSON)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // OkHttp (Logging - helps debug API calls)
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.3'

    // Lifecycle (ViewModel & LiveData)
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.2'

    // Lottie for Animations
    implementation 'com.airbnb.android:lottie:6.1.0'

    // CardView for modern boxes
    implementation 'androidx.cardview:cardview:1.0.0'
    
    // RecyclerView for history
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    
    // Glide for image loading (chroma visualization)
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    
    // Navigation Component
    implementation 'androidx.navigation:navigation-fragment:2.7.6'
    implementation 'androidx.navigation:navigation-ui:2.7.6'
    
    // Room for local storage
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.room:room-rxjava3:2.6.1'
    
    // SharedPreferences (simpler alternative for settings)
    implementation 'androidx.preference:preference:1.2.1'
    
    // ViewPager2 for tabs
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    
    // Fragment
    implementation 'androidx.fragment:fragment:1.6.2'
}