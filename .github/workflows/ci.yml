name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel numpy
          pip install -r chordify_backend/requirements.txt pytest httpx mir_eval soxr==1.1.0 onnxruntime==1.30.0
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install onnx pretty_midi
      - name: Build the NNLS Chroma plugin, install FluidSynth and ffmpeg
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libboost-dev fluidsynth fluid-soundfont-gm ffmpeg
          pip install --no-build-isolation vamp==1.1.0
          bash tools/install_nnls_chroma.sh
          python -c "from chordify_core.features import nnls_available; assert nnls_available()"
      - name: Test
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: chordify-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chordify-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: The Android app's golden file of this code is up to date
        run: node --experimental-strip-types ../tools/web_goldens.mjs --check

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Engine tests
        run: ./gradlew :engine:testDebugUnitTest
      - name: App tests
        run: ./gradlew :app:testDebugUnitTest

  android-device:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Mobile
    steps:
      - uses: actions/checkout@v5
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Engine device tests (x86_64 emulator)
        run: ./gradlew :engine:api34DebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - name: App device tests (x86_64 emulator)
        run: ./gradlew :app:api34DebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
