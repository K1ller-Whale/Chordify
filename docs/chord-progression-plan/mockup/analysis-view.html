<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chordify analysis view (mockup)</title>
<!--
  Clickable mockup of the v2 "Analysis" screen. It renders the AnalysisResult JSON
  embedded below (same shape as GET /api/v2/analyses/{id}/result). Playback is a
  simulated clock - there is no audio. Regenerate the data with
  docs/chord-progression-plan/scripts/make_mockup_data.py.
  URL options: #t=97.5 (start time), ?theme=dark|light, ?play=1
-->
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f0efec; --ink: #0b0b0b; --ink-2: #52514e;
    --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10);
    --tonic: #2a78d6; --dominant: #eb6834; --subdominant: #1baf7a; --borrowed: #898781;
    --tint: 22%; --wave: #c3c2b7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --surface-2: #242423; --ink: #ffffff; --ink-2: #c3c2b7;
      --muted: #898781; --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
      --tonic: #3987e5; --dominant: #d95926; --subdominant: #199e70; --borrowed: #898781;
      --tint: 30%; --wave: #383835;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #242423; --ink: #ffffff; --ink-2: #c3c2b7;
    --muted: #898781; --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
    --tonic: #3987e5; --dominant: #d95926; --subdominant: #199e70; --borrowed: #898781;
    --tint: 30%; --wave: #383835;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button { font: inherit; color: inherit; }
  .app { max-width: 1440px; margin: 0 auto; padding: 16px 24px 32px; }
  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .brand { font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
  .song { display: flex; flex-direction: column; margin-right: auto; }
  .song b { font-size: 20px; letter-spacing: -.01em; }
  .song span { color: var(--ink-2); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 4px 12px; color: var(--ink-2); white-space: nowrap; }
  .chip b { color: var(--ink); font-weight: 600; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; background: var(--surface); }
  .seg button { border: 0; background: none; padding: 4px 12px; cursor: pointer; color: var(--ink-2); }
  .seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); font-weight: 600; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
  .card h2 { margin: 0 0 12px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .grid-top { display: grid; grid-template-columns: 5fr 7fr; gap: 16px; margin-bottom: 16px; }
  .grid-bottom { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-top: 16px; }
  /* Now card */
  .now { display: flex; gap: 20px; align-items: center; }
  .now-name { font-size: 64px; font-weight: 700; line-height: 1; letter-spacing: -.03em; }
  .now-meta { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
  .fn { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .left { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
  .left > div { height: 100%; border-radius: 3px; background: var(--ink-2); }
  .small { color: var(--muted); font-size: 12px; }
  .diagram { flex: none; }
  /* Next card */
  .next-list { display: flex; flex-direction: column; gap: 10px; }
  .pred { display: grid; grid-template-columns: 76px 48px 1fr 48px; gap: 12px; align-items: center; }
  .pred .name { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
  .pred .rn { color: var(--ink-2); font-weight: 600; }
  .pred .bar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
  .pred .bar > div { height: 100%; border-radius: 0 4px 4px 0; }
  .pred .pct { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .pred .why { grid-column: 2 / 5; color: var(--muted); font-size: 12px; margin-top: -6px; }
  .next-foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--grid); color: var(--ink-2); font-size: 13px; }
  .ok { font-weight: 600; color: var(--ink); }
  /* Timeline */
  .overview { position: relative; height: 34px; margin-bottom: 12px; cursor: pointer; }
  .overview svg { width: 100%; height: 100%; display: block; }
  .detail { position: relative; height: 196px; overflow: hidden; border-radius: 8px; background: var(--surface); cursor: pointer; }
  .detail svg.track { position: absolute; left: 0; top: 0; will-change: transform; }
  .playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); left: 33%; pointer-events: none; }
  .playhead::before { content: ""; position: absolute; top: -1px; left: -5px; border: 6px solid transparent; border-top-color: var(--ink); }
  .transport { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  .play { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--ink); color: var(--surface); cursor: pointer; display: grid; place-items: center; }
  .time { font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .legend { display: flex; gap: 16px; margin-left: auto; color: var(--ink-2); font-size: 12px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 14px; height: 10px; border-radius: 2px; display: inline-block; }
  /* Bottom panels */
  .cof svg { width: 100%; max-width: 340px; display: block; margin: 0 auto; }
  .share-row { display: grid; grid-template-columns: 64px 1fr 44px; gap: 10px; align-items: center; margin-bottom: 8px; }
  .share-row .bar { height: 12px; border-radius: 0 4px 4px 0; }
  .share-row .pct { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .patterns { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--grid); }
  .pattern { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; }
  .pattern b { letter-spacing: .02em; }
  .sheet { max-height: 324px; overflow: auto; scroll-behavior: smooth; }
  .sheet h3 { margin: 12px 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: capitalize; }
  .sheet h3:first-child { margin-top: 0; }
  .bars { display: grid; grid-template-columns: repeat(4, 1fr); border-left: 2px solid var(--axis); }
  .barcell { border-right: 1px solid var(--axis); border-bottom: 1px solid var(--grid); padding: 8px 10px; font-weight: 600; cursor: pointer; }
  .barcell.cur { background: var(--surface-2); box-shadow: inset 0 -3px 0 var(--ink); }
  @media (max-width: 900px) {
    .app { padding: 12px 16px 24px; }
    .grid-top, .grid-bottom { grid-template-columns: 1fr; }
    .now-name { font-size: 48px; }
    .diagram { width: 96px; height: 120px; }
    .legend { margin-left: 0; }
    .chips .optional { display: none; }
  }
</style>
</head>

<div class="app">
  <header>
    <div class="brand">Chordify</div>
    <div class="song"><b id="title"></b><span id="artist"></span></div>
    <div class="chips" id="chips"></div>
    <div class="seg" role="group" aria-label="Chord notation">

    </div>
  </header>

  <div class="grid-top">
    <section class="card" aria-live="polite">
      <h2>Now playing</h2>
      <div class="now">
        <div class="now-meta">
          <div class="now-name" id="nowName"></div>
          <div class="fn" id="nowFn"></div>
          <div class="small" id="nowScale"></div>
          <div class="left"><div id="nowLeft"></div></div>
          <div class="small" id="nowBeats"></div>

        <svg class="diagram" id="nowDiagram" width="120" height="150" viewBox="0 0 120 150" aria-label="Guitar chord diagram"></svg>

    <section class="card">
      <h2>What comes next</h2>
      <div class="next-list" id="nextList"></div>
      <div class="next-foot"><span id="nextActual"></span><span id="nextPrior"></span></div>
    </section>
  </div>

  <section class="card">
    <h2>Timeline</h2>
    <div class="overview" id="overview"></div>
    <div class="detail" id="detail"><div class="playhead"></div></div>
    <div class="transport">
      <button class="play" id="play" aria-label="Play">
        <svg width="14" height="16" viewBox="0 0 14 16" id="playIcon"><path d="M1 1l12 7-12 7z" fill="currentColor"/></svg>
      </button>
      <span class="time" id="time"></span>
      <span class="chip">Speed <b>1.0×</b></span>
      <span class="chip optional">Loop chord</span>
      <span class="chip optional">Practice: hide upcoming</span>
      <div class="legend">
        <span><i style="background:var(--tonic)"></i>Tonic</span>
        <span><i style="background:var(--subdominant)"></i>Subdominant</span>
        <span><i style="background:var(--dominant)"></i>Dominant</span>
        <span><i style="background:repeating-linear-gradient(45deg,var(--borrowed) 0 2px,transparent 2px 5px)"></i>Outside the key</span>
        <span>✦ Surprising change</span>
      </div>
    </div>
  </section>

  <div class="grid-bottom">
    <section class="card cof"><h2>Circle of fifths</h2><svg id="cof" viewBox="0 0 340 340" role="img" aria-label="Chords of the song on the circle of fifths"></svg></section>
    <section class="card"><h2>Time per chord</h2><div id="share"></div><div class="patterns" id="patterns"></div></section>
    <section class="card"><h2>Lead sheet</h2><div class="sheet" id="sheet"></div></section>
  </div>
</div>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  if (params.get("theme")) document.documentElement.dataset.theme = params.get("theme");
  const data = JSON.parse(document.getElementById("analysis-data").textContent);
  const chords = data.chords;
  const duration = data.source.duration;
  const NS = "http://www.w3.org/2000/svg";
  const $ = (id) => document.getElementById(id);
  const fnColor = (fn) => fn ? `var(--${fn})` : "var(--grid)";
  const fnName = { tonic: "Tonic", subdominant: "Subdominant", dominant: "Dominant", borrowed: "Outside the key" };
  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  let notation = "letters";
  const nameOf = (c) => c.label === "N" ? "N.C." : notation === "roman" ? c.roman : c.display;
  const el = (tag, attrs = {}, parent) => {

  // Binary search: index of the chord sounding at time t.

    return lo;

    const x0 = 20, y0 = 28, dx = 16, dy = 24;

    for (let s = 0; s < 6; s++) el("line", { x1: x0 + s * dx, y1: y0, x2: x0 + s * dx, y2: y0 + dy * 4, stroke: "var(--axis)" }, svg);

      else if (f === 0) el("circle", { cx: x, cy: y0 - 14, r: 4, fill: "none", stroke: "var(--ink-2)", "stroke-width": 1.5 }, svg);

  // Detail timeline: one wide SVG for the whole song, translated under a fixed playhead.

  const Y = { sec: 6, secH: 22, beat: 34, rib: 44, ribH: 64, wave: 118, waveH: 70 };
  // Section labels stay pinned to the left edge while their section is on screen (see frame()).
  const sectionLabels = data.sections.map((s, i) => {

    const t = el("text", { x: s.start * PPS + 10, y: Y.sec + 15, "font-size": 12, "font-weight": 600, fill: "var(--ink-2)" }, track);

  data.beats.forEach((b) => el("line", { x1: b * PPS, x2: b * PPS, y1: Y.beat, y2: H - 4, stroke: "var(--grid)", "stroke-width": 1 }, track));

  });
  const blockEls = [];
  chords.forEach((c) => {

    const color = fnColor(c.function);
    const fill = c.function === "borrowed" ? "url(#hatch)" : c.label === "N" ? "var(--surface-2)" : `color-mix(in srgb, ${color} var(--tint), var(--surface))`;
    const body = el("rect", { x, y: Y.rib, width: w, height: Y.ribH, rx: 6, fill }, g);
    el("rect", { x, y: Y.rib + Y.ribH - 5, width: w, height: 5, rx: 2, fill: c.label === "N" ? "var(--axis)" : color }, g);
    const name = el("text", { x: x + 10, y: Y.rib + 26, "font-size": 18, "font-weight": 700, fill: "var(--ink)" }, g);
    const sub = el("text", { x: x + 10, y: Y.rib + 45, "font-size": 12, fill: "var(--ink-2)" }, g);
    if (c.surprise) el("text", { x: x + w - 18, y: Y.rib + 20, "font-size": 13, fill: "var(--ink)" }, g).textContent = "✦";
    blockEls.push({ c, body, name, sub, color, fill, w });
  });
  function labelBlocks() {
    blockEls.forEach(({ c, name, sub, w }) => {
      name.textContent = w > 34 ? nameOf(c) : "";
      sub.textContent = w > 60 && c.label !== "N" ? (notation === "roman" ? c.display : c.roman) : "";
    });
  }
  // Illustrative waveform (no audio in the mockup): louder in choruses, deterministic noise.
  const loud = { intro: 0.35, verse: 0.55, chorus: 0.9, bridge: 0.7, interlude: 0.45, solo: 0.8 };
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  let path = "";
  for (let t = 0; t < duration; t += 0.12) {
    const s = data.sections.find((x) => t >= x.start && t < x.end);
    const beatPulse = 0.75 + 0.25 * Math.cos(((t - (data.beats[0] || 0)) / (60 / data.tempo.bpm)) * 2 * Math.PI);
    const a = (s ? loud[s.label] ?? 0.5 : 0.08) * beatPulse * (0.55 + 0.45 * rnd()) * (Y.waveH / 2 - 2);
    path += `M${(t * PPS).toFixed(1)} ${(Y.wave + Y.waveH / 2 - a).toFixed(1)}V${(Y.wave + Y.waveH / 2 + a).toFixed(1)}`;
  }
  el("path", { d: path, stroke: "var(--wave)", "stroke-width": 4, "stroke-linecap": "round" }, track);

  // Overview strip: whole song, sections + chord colors, viewport box.
  const ov = el("svg", { viewBox: `0 0 1000 34`, preserveAspectRatio: "none" }, $("overview"));
  const sx = (t) => (t / duration) * 1000;
  chords.forEach((c) => el("rect", { x: sx(c.start), y: 12, width: Math.max(0.5, sx(c.end) - sx(c.start) - 0.6), height: 18,
    fill: c.label === "N" ? "var(--grid)" : c.function === "borrowed" ? "var(--borrowed)" : fnColor(c.function) }, ov));
  data.sections.forEach((s) => el("rect", { x: sx(s.start), y: 0, width: 0.8, height: 34, fill: "var(--ink-2)" }, ov));
  const viewport = el("rect", { y: 9, height: 24, rx: 3, fill: "none", stroke: "var(--ink)", "stroke-width": 1.5, "vector-effect": "non-scaling-stroke" }, ov);
  const ovHead = el("rect", { y: 0, width: 1.2, height: 34, fill: "var(--ink)" }, ov);

  // Circle of fifths
  const cof = $("cof");
  const MAJ = ["C", "G", "D", "A", "E", "B", "F#", "Db", "Ab", "Eb", "Bb", "F"];
  const MIN = ["Am", "Em", "Bm", "F#m", "C#m", "G#m", "D#m", "Bbm", "Fm", "Cm", "Gm", "Dm"];
  const C0 = 170, RO = 132, RI = 88;
  const pos = (i, r) => [C0 + r * Math.sin((i * Math.PI) / 6), C0 - r * Math.cos((i * Math.PI) / 6)];
  const tonicIdx = MAJ.indexOf(key.tonic);
  const wedge = (a0, a1, r0, r1) => {
    const p = (a, r) => [C0 + r * Math.sin(a), C0 - r * Math.cos(a)];
    const [x0, y0] = p(a0, r1), [x1, y1] = p(a1, r1), [x2, y2] = p(a1, r0), [x3, y3] = p(a0, r0);
    return `M${x0} ${y0}A${r1} ${r1} 0 0 1 ${x1} ${y1}L${x2} ${y2}A${r0} ${r0} 0 0 0 ${x3} ${y3}Z`;
  };
  el("path", { d: wedge(((tonicIdx - 1.5) * Math.PI) / 6, ((tonicIdx + 1.5) * Math.PI) / 6, 62, 158), fill: "var(--surface-2)" }, cof);
  el("circle", { cx: C0, cy: C0, r: RO, fill: "none", stroke: "var(--grid)" }, cof);
  el("circle", { cx: C0, cy: C0, r: RI, fill: "none", stroke: "var(--grid)" }, cof);
  const rootOf = (c) => c.display.replace(/(maj9|maj7|m7|7sus4|sus4|7|6|9|dim|aug|m7b5)$/, "").replace(/m$/, "");

    const minor = c.roman && c.roman === c.roman.toLowerCase() && c.roman !== c.roman.toUpperCase();
    const r = rootOf(c);
    const idx = minor ? MIN.indexOf(r + "m") : MAJ.indexOf(r);
    return idx < 0 ? null : pos(idx, minor ? RI : RO);
  };
  const shareBy = Object.fromEntries(data.summary.time_share.map((s) => [s.display, s.share]));
  const trans = {};
  real.forEach((c, i) => { if (i && real[i - 1].display !== c.display) { const k = real[i - 1].display + ">" + c.display; trans[k] = (trans[k] || 0) + 1; } });
  const maxT = Math.max(...Object.values(trans));
  const byDisplay = Object.fromEntries(real.map((c) => [c.display, c]));
  const arcLayer = el("g", {}, cof);
  Object.entries(trans).forEach(([k, n]) => {
    const [a, b] = k.split(">").map((d) => nodeOf(byDisplay[d]));
    if (!a || !b) return;
    const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
    const cx = C0 + (mx - C0) * 0.25, cy = C0 + (my - C0) * 0.25;
    el("path", { d: `M${a[0]} ${a[1]}Q${cx} ${cy} ${b[0]} ${b[1]}`, fill: "none", stroke: "var(--ink-2)", "stroke-opacity": 0.35, "stroke-width": 1 + (5 * n) / maxT, "stroke-linecap": "round" }, arcLayer);
  });
  const predArc = el("path", { fill: "none", stroke: "var(--ink)", "stroke-width": 2, "stroke-dasharray": "4 4" }, cof);
  const cofNodes = {};
  Object.values(byDisplay).forEach((c) => {
    const p = nodeOf(c);
    if (!p) return;
    const r = 8 + 16 * Math.sqrt(shareBy[c.display] || 0);
    const g = el("g", {}, cof);
    const ring = el("circle", { cx: p[0], cy: p[1], r: r + 4, fill: "none", stroke: "var(--ink)", "stroke-width": 2, opacity: 0 }, g);
    el("circle", { cx: p[0], cy: p[1], r, fill: fnColor(c.function), stroke: "var(--surface)", "stroke-width": 2 }, g);
    el("text", { x: p[0], y: p[1] + 4, "text-anchor": "middle", "font-size": 11, "font-weight": 700, fill: "#fff" }, g).textContent = rootOf(c) + (c.roman === c.roman.toLowerCase() ? "m" : "");
    cofNodes[c.display] = { ring, p };
  });
  // Static labels for every key, except where a chord node already names the spot.
  const used = new Set(Object.values(byDisplay).map((c) => rootOf(c) + (c.roman === c.roman.toLowerCase() ? "m" : "")));
  MAJ.forEach((m, i) => { if (used.has(m)) return; const [x, y] = pos(i, RO); el("text", { x, y: y + 4, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)", stroke: "var(--surface)", "stroke-width": 4, "paint-order": "stroke" }, cof).textContent = m; });
  MIN.forEach((m, i) => { if (used.has(m)) return; const [x, y] = pos(i, RI); el("text", { x, y: y + 4, "text-anchor": "middle", "font-size": 10, fill: "var(--muted)", stroke: "var(--surface)", "stroke-width": 4, "paint-order": "stroke" }, cof).textContent = m; });

  // Time share + patterns
  $("share").innerHTML = data.summary.time_share.map((s) => {
    const c = byDisplay[s.display];
    return `<div class="share-row"><b>${s.display}</b><div class="bar" style="width:${(s.share / data.summary.time_share[0].share) * 100}%;background:${fnColor(c.function)}"></div><span class="pct">${Math.round(s.share * 100)}%</span></div>`;
  }).join("");
  $("patterns").innerHTML = `<div class="small" style="margin-bottom:4px">Repeating progressions</div>` + data.summary.patterns.map((p) =>
    `<div class="pattern"><span><b>${p.roman.join(" – ")}</b>${p.name ? `<br><span class="small">${p.name}</span>` : ""}</span><span class="time">×${p.count}</span></div>`).join("");

  // Lead sheet
  const sheet = $("sheet");
  const barEls = [];
  function renderSheet() {
    sheet.innerHTML = "";
    barEls.length = 0;
    let grid = null;
    data.bars.forEach((b) => {
      const sec = data.sections.find((s) => Math.abs(s.start - b.start) < 0.05);
      if (sec || !grid) {
        const h = document.createElement("h3");
        h.textContent = sec ? `${sec.letter.replace(/'/g, "′")} · ${sec.label}` : "";
        sheet.appendChild(h);
        grid = document.createElement("div");
        grid.className = "bars";
        sheet.appendChild(grid);
      }
      const cell = document.createElement("div");
      cell.className = "barcell";
      cell.textContent = b.chords.map((d) => notation === "roman" ? (byDisplay[d] || {}).roman || d : d).join("  ");
      cell.onclick = () => seek(b.start + 0.01);
      grid.appendChild(cell);
      barEls.push({ b, cell });
    });
  }

  // Playback state
  let t = parseFloat((location.hash.match(/t=([\d.]+)/) || [])[1] || "0");
  let playing = params.get("play") === "1", last = null, curIdx = -1, curBar = -1;
  function seek(v) { t = Math.max(0, Math.min(duration, v)); curIdx = -1; frame(); }
  function renderNow(i) {
    const c = chords[i];
    blockEls.forEach((b) => {
      const active = b.c === c;
      b.body.setAttribute("fill", active && c.label !== "N" && c.function !== "borrowed" ? b.color : b.fill);
      b.name.setAttribute("fill", active && c.label !== "N" ? "#fff" : "var(--ink)");
      b.sub.setAttribute("fill", active && c.label !== "N" ? "#fff" : "var(--ink-2)");
    });
    $("nowName").textContent = nameOf(c);
    $("nowFn").innerHTML = c.label === "N" ? "No chord" : `<span class="dot" style="background:${fnColor(c.function)}"></span><b>${notation === "roman" ? c.display : c.roman}</b> · ${fnName[c.function]} in ${key.tonic} ${key.mode}`;
    $("nowScale").textContent = c.scale_hint ? `Scale to play over it: ${c.scale_hint}` : "";
    drawDiagram($("nowDiagram"), c.display);
    Object.values(cofNodes).forEach((n) => n.ring.setAttribute("opacity", 0));
    if (cofNodes[c.display]) cofNodes[c.display].ring.setAttribute("opacity", 1);
    const preds = c.next || [];
    $("nextList").innerHTML = preds.map((p, k) => {
      const known = byDisplay[p.display];
      return `<div class="pred"><span class="name">${notation === "roman" ? p.roman : p.display}</span><span class="rn">${notation === "roman" ? p.display : p.roman}</span>
        <div class="bar"><div style="width:${p.p * 100}%;background:${known ? fnColor(known.function) : "var(--ink-2)"}"></div></div><span class="pct">${Math.round(p.p * 100)}%</span>
        <span class="why">${k === 0 ? "Most likely · " : ""}${p.reason}</span></div>`;
    }).join("") || `<span class="small">Waiting for the first chord…</span>`;
    const ri = real.indexOf(c);
    const actual = real[ri + 1];
    if (actual && preds.length) {
      const rank = preds.findIndex((p) => p.roman === actual.roman);
      $("nextActual").innerHTML = `Actual next: <span class="ok">${nameOf(actual)}</span> ${rank >= 0 ? `✓ predicted #${rank + 1}` : "✦ not in top 3"}`;
    } else $("nextActual").textContent = "";
    $("nextPrior").textContent = c.theory_only && c.theory_only.length ? `Without this song’s history: ${c.theory_only.map((p) => `${p.roman} ${Math.round(p.p * 100)}%`).join(" · ")}` : "";
    const top = preds[0] && byDisplay[preds[0].display];
    if (top && cofNodes[c.display] && cofNodes[top.display]) {
      const a = cofNodes[c.display].p, b = cofNodes[top.display].p;
      predArc.setAttribute("d", `M${a[0]} ${a[1]}L${b[0]} ${b[1]}`);
    } else predArc.setAttribute("d", "");
  }
  function frame() {
    const i = chordAt(t);
    if (i !== curIdx) { curIdx = i; renderNow(i); }
    const c = chords[i];
    const left = Math.max(0, c.end - t);
    $("nowLeft").style.width = `${(1 - left / (c.end - c.start)) * 100}%`;
    const beatsLeft = data.beats.filter((b) => b > t && b < c.end - 0.05).length;
    $("nowBeats").textContent = c.label === "N" ? "" : `${beatsLeft} beat${beatsLeft === 1 ? "" : "s"} until the change (${left.toFixed(1)} s)`;
    const w = detail.clientWidth, headX = w * 0.33;
    track.style.transform = `translateX(${headX - t * PPS}px)`;
    const viewStart = (t - headX / PPS) * PPS;
    sectionLabels.forEach(({ s, t: label }) =>
      label.setAttribute("x", Math.max(s.start * PPS + 10, Math.min(viewStart + 10, s.end * PPS - 110))));
    viewport.setAttribute("x", sx(t - headX / PPS));
    viewport.setAttribute("width", sx(w / PPS));
    ovHead.setAttribute("x", sx(t));
    $("time").textContent = `${fmt(t)} / ${fmt(duration)}`;
    const bi = data.bars.findIndex((b) => t >= b.start && t < b.end);
    if (bi !== curBar && barEls[bi]) {
      if (barEls[curBar]) barEls[curBar].cell.classList.remove("cur");
      curBar = bi;
      barEls[bi].cell.classList.add("cur");
      const cell = barEls[bi].cell;
      sheet.scrollTop = cell.offsetTop - sheet.offsetTop - sheet.clientHeight / 2;
    }
  }
  function loop(ts) {
    if (playing) { if (last != null) t = Math.min(duration, t + (ts - last) / 1000); last = ts; if (t >= duration) playing = false; }
    else last = null;
    frame();
    requestAnimationFrame(loop);
  }
  $("play").onclick = () => {
    playing = !playing;
    $("playIcon").innerHTML = playing ? '<path d="M1 1h4v14H1zM9 1h4v14H9z" fill="currentColor"/>' : '<path d="M1 1l12 7-12 7z" fill="currentColor"/>';
  };
  detail.onclick = (e) => { const r = detail.getBoundingClientRect(); seek(t + (e.clientX - r.left - r.width * 0.33) / PPS); };
  $("overview").onclick = (e) => { const r = e.currentTarget.getBoundingClientRect(); seek(((e.clientX - r.left) / r.width) * duration); };
  function setNotation(n) {
    notation = n;
    $("nLetters").setAttribute("aria-pressed", n === "letters");
    $("nRoman").setAttribute("aria-pressed", n === "roman");
    labelBlocks(); renderSheet(); curIdx = -1; curBar = -1; frame();
  }
  $("nLetters").onclick = () => setNotation("letters");
  $("nRoman").onclick = () => setNotation("roman");
  labelBlocks(); renderSheet(); frame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
